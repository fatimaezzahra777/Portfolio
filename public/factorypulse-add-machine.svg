<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1910 916" role="img" aria-labelledby="title desc">
  <title id="title">FactoryPulse — Ajouter une machine</title>
  <desc id="desc">Capture illustrative de l’écran d’ajout d’une machine FactoryPulse.</desc>
  <rect width="1910" height="916" fill="#f3f5f9"/>
  <rect width="1910" height="72" fill="#263f87"/>
  <text x="19" y="43" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Factory<tspan fill="#92baff">Pulse</tspan></text>
  <text x="1468" y="43" fill="#eef2ff" font-family="Arial,sans-serif" font-size="21">Tableau de bord</text>
  <text x="1668" y="43" fill="#eef2ff" font-family="Arial,sans-serif" font-size="21">Machines</text>
  <rect x="1782" y="9" width="110" height="52" rx="12" fill="#fff" stroke="#121a32" stroke-width="2"/>
  <text x="1802" y="43" fill="#263f87" font-family="Arial,sans-serif" font-size="20">Ajouter</text>
  <rect x="592" y="102" width="721" height="165" fill="#bfdbfe"/>
  <text x="623" y="169" fill="#1e293b" font-family="Arial,sans-serif" font-size="38" font-weight="700">Ajouter une machine</text>
  <text x="623" y="200" fill="#64748b" font-family="Arial,sans-serif" font-size="20">Renseignez les informations</text>
  <rect x="592" y="296" width="721" height="543" rx="16" fill="#fff" stroke="#e1e5ec"/>
  <g font-family="Arial,sans-serif" font-size="20" fill="#1e293b">
    <text x="623" y="349">Nom de la machine</text><rect x="623" y="362" width="660" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="623" y="456">Zone de production</text><rect x="623" y="469" width="660" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="623" y="563">Status</text><rect x="623" y="576" width="660" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="644" y="609" font-size="18">En fonctionnement</text>
    <text x="623" y="670">La production</text><rect x="623" y="683" width="660" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
  </g>
  <rect x="623" y="754" width="660" height="55" rx="11" fill="#284fe2"/>
  <text x="870" y="789" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Ajouter Machine</text>
